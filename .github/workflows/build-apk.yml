name: Build APK - STASIUN CUACA DESA TURUS v1.5.6

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  tags:
    - 'v*'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.4.1'

      - name: Check Java and Gradle
        run: |
          java --version
          gradle --version

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Build release APK
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Verify APKs
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: STASIUN-CUACA-DESA-TURUS-v1.5.6-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

